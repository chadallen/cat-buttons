; Cat Button Board. One environment per firmware phase; see docs/BUILD.md.
;
; Platform: pioarduino's espressif32 fork, which ships arduino-esp32 core 3.x.
; PlatformIO's own espressif32 platform stopped at core 2.0.17, and phase 2
; needs the ESP_I2S API that only exists in 3.x.

[platformio]
default_envs = phase3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Release DTR/RTS so the monitor doesn't hold the board in reset through the CP2102.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -Wall -Wextra

; Phase 0: serial hello. Proves the toolchain, cable and driver.
[env:phase0]
build_src_filter = +<phase0_hello/>

; Phase 1: one-pad paw test on GPIO4 with the piezo on GPIO23.
[env:phase1]
build_src_filter = +<phase1_pawtest/>

; Phase 2: WAV playback from LittleFS through the MAX98357A, triggered by
; serial keys or the GPIO4 pad. Clips: tools/make_clips.sh, then -t uploadfs.
[env:phase2]
build_src_filter = +<phase2_audio/>

; Phase 3: the full board. Every pad in the config table plays its clip.
[env:phase3]
build_src_filter = +<phase3_board/>
